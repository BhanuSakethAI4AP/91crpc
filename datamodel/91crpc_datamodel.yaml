title: "91CrPC Data Model"
version: "1.0"
database: "91crpc"
notes:
  - ObjectId refers to MongoDB ObjectId.
  - Date is ISO 8601 datetime (UTC).
  - Arrays show item types in brackets.
  - Fields not marked required are optional by default.

value_sets:
  91CrPCOperatorType: [Telecom, Bank, ISP]
  CrPCRequestStatus: [OnApprovalQueue, Approved, Reject, Closed, sent]
  lineItemRequestStatus: [OnApprovalQueue, Approved, Reject, FlagedAsVIP, ApprovedbySHO]
  DispatchModes: [Email, SMS]
  ApprovalRoles: [IO, SHO, CI, DSP, Admin ASP, SP]
  RejectReasons: ["VIP Number ....."]
  ApprovalChainStatus: [ApprovedbySHO, ApprovedbyCI, ApprovedbyDSP, ApprovedbyASP, AckByITCore, Reject, FlagedAsVIP, Approved]
  consolidatedCrpcRequestStatus: [Downloaded, NotDownloaded, downloaded]
  dataReceivedStatus: [Mapped, Conflict]

collections:

  - name: service_master
    purpose: Master list of services (e.g., CDR, IPDR, IMEI, CAF, Tower Dump, Banking)
    fields:
      _id:            { type: ObjectId, required: true }
      serviceName:    { type: string, required: true, example: "CDR" }
      operatorType:   { type: array[string], required: true, example: ["telecom"] }
      keyField:       { type: string, required: true, example: "phoneNo" }
      canBeConsolidated: { type: boolean, required: true }
      createdBy:      { type: ObjectId }
      createdAt:      { type: Date }
      updatedBy:      { type: ObjectId }
      updatedAt:      { type: Date }
      isDeleted:      { type: boolean, default: false }
      createdIp:      { type: string }
      updatedIp:      { type: string }
    relations:
      - field: createdBy
        ref: core.users._id
      - field: updatedBy
        ref: core.users._id
    indexes:
      - name: _id_
        keys: [{ _id: 1 }]
      - name: idx_service_master__auditIps_asc
        keys: [{ createdIp: 1 }, { updatedIp: 1 }]
      - name: idx_service_master__serviceName_asc
        keys: [{ serviceName: 1 }]
        unique: true
      # you also listed a non-unique lookup on serviceName; mongo can't keep duplicate identical key indexes.

  - name: operators_list
    purpose: Operators (telecom/bank/ISP)
    fields:
      _id:           { type: ObjectId, required: true }
      operatorType:  { type: string, enum: 91CrPCOperatorType, required: true }
      operatorName:  { type: string, required: true }
      contact:
        type: array[object]
        item:
          name:        { type: string }
          designation: { type: string }
          email:       { type: string }
          phone:       { type: string }
      isDeleted:     { type: boolean, default: false }
      createdBy:     { type: ObjectId }
      createdAt:     { type: Date }
      updatedBy:     { type: ObjectId }
      updatedAt:     { type: Date }
      createdIp:     { type: string }
      updatedIp:     { type: string }
    indexes:
      - name: _id_
        keys: [{ _id: 1 }]
      - name: idx_operators_list__auditIps_asc
        keys: [{ createdIp: 1 }, { updatedIp: 1 }]
      - name: idx_operators_list__operatorName_asc
        keys: [{ operatorName: 1 }]
      - name: idx_operators_list__operatorType_operatorName_asc
        keys: [{ operatorType: 1 }, { operatorName: 1 }]
        unique: true

  - name: operator_service_list
    purpose: Maps services to operator-specific formats and required fields
    fields:
      _id:           { type: ObjectId, required: true }
      serviceId:     { type: ObjectId, ref: service_master._id, required: true }
      operatorFormats:
        type: array[object]
        item:
          operatorId:        { type: ObjectId, ref: operators_list._id, required: true }
          formatFilePath:    { type: string, required: true }
          listOfAttachments:
            type: array[object]
            item:
              attachmentName: { type: string }
              formatFilePath: { type: string }
      requiredData:  { type: object, example: { fromDate: "YYYY-MM-DD", toDate: "YYYY-MM-DD" } }
      createdBy:     { type: ObjectId }
      createdAt:     { type: Date }
      updatedBy:     { type: ObjectId }
      updatedAt:     { type: Date }
      isDeleted:     { type: boolean, default: false }
      createdIp:     { type: string }
      updatedIp:     { type: string }
    indexes:
      - name: _id_
        keys: [{ _id: 1 }]
      - name: idx_operator_service_list__auditIps_asc
        keys: [{ createdIp: 1 }, { updatedIp: 1 }]
      - name: idx_operator_service_list__serviceId_operatorId_asc
        keys: [{ serviceId: 1 }, { "operatorFormats.operatorId": 1 }]

  - name: approval_flow_master
    purpose: Defines approval workflow steps for requests
    fields:
      _id:        { type: ObjectId, required: true }
      steps:
        type: array[object]
        item:
          role:  { type: string, enum: ApprovalRoles, required: true }
          order: { type: number, required: true }
      created_by: { type: ObjectId }
      created_at: { type: Date }
      updated_by: { type: ObjectId }
      updated_at: { type: Date }
      is_deleted: { type: boolean, default: false }
      createdIp:  { type: string }
      updatedIp:  { type: string }
    indexes:
      - name: _id_
        keys: [{ _id: 1 }]
      - name: idx_approval_flow_master__auditIps_asc
        keys: [{ createdIp: 1 }, { updatedIp: 1 }]
      - name: idx_approval_flow_master__steps_role_order_asc
        keys: [{ "steps.role": 1 }, { "steps.order": 1 }]

  - name: crpc_requests
    purpose: Root request entity created from SHO/IO letters
    fields:
      _id:                { type: ObjectId, required: true }
      unitId:             { type: ObjectId, ref: core.units._id, required: true }
      requestedBy:        { type: ObjectId, ref: core.users._id, required: true }
      approvedBy:         { type: ObjectId, ref: core.users._id, required: true }
      fir:
        type: array[object]
        required: true
        item:
          firNo: { type: number, required: true }
          path:  { type: string }
      serviceList:
        type: array[object]
        required: true
        item:
          lineNo:       { type: number, required: true }
          serviceId:    { type: ObjectId, ref: service_master._id, required: true }
          keyFieldValue:{ type: string, required: true }
          requiredData: { type: object } # e.g., { fromDate, toDate }
      attachmentsNeededForRequest:
        type: array[object]
        item:
          attachmentName: { type: string }
          formatFilePath: { type: string }
      requestDate:        { type: Date, required: true }
      ackNo:              { type: string }
      CrPCRequestStatus:  { type: string, enum: CrPCRequestStatus }
      isActive:           { type: boolean, default: true }
      createdBy:          { type: ObjectId }
      createdAt:          { type: Date }
      updatedBy:          { type: ObjectId }
      updatedAt:          { type: Date }
      createdIp:          { type: string }
      updatedIp:          { type: string }
    relations:
      - field: serviceList[].serviceId
        ref: service_master._id
      - field: unitId
        ref: core.units._id
      - field: requestedBy
        ref: core.users._id
      - field: approvedBy
        ref: core.users._id
    indexes:
      - name: _id_
        keys: [{ _id: 1 }]
      - name: idx_crpc_requests__auditIps_asc
        keys: [{ createdIp: 1 }, { updatedIp: 1 }]
      - name: idx_crpc_requests__firNo_asc
        keys: [{ "fir.firNo": 1 }]
      - name: idx_crpc_requests__status_asc
        keys: [{ CrPCRequestStatus: 1 }]
      - name: idx_crpc_requests__unitId_firNo_asc
        keys: [{ "fir.firNo": 1 }, { unitId: 1 }]
        unique: true

  - name: crpc_request_pipelines
    purpose: Per-line item pipelines derived from crpc_requests.serviceList
    fields:
      _id:                   { type: ObjectId, required: true }
      crpcRequestId:         { type: ObjectId, ref: crpc_requests._id, required: true }
      lineItem:              { type: number, required: true }
      operatorId:            { type: ObjectId, ref: operators_list._id, required: true }
      serviceId:             { type: ObjectId, ref: service_master._id, required: true }
      keyFieldValue:         { type: string, required: true }
      requiredData:          { type: object, required: true } # { fromDate, toDate }
      lineItemRequestStatus: { type: string, enum: lineItemRequestStatus }
      isActive:              { type: boolean, default: true }
      createdBy:             { type: ObjectId }
      createdAt:             { type: Date }
      updatedBy:             { type: ObjectId }
      updatedAt:             { type: Date }
      createdIp:             { type: string }
      updatedIp:             { type: string }
    relations:
      - field: crpcRequestId
        ref: crpc_requests._id
      - field: operatorId
        ref: operators_list._id
      - field: serviceId
        ref: service_master._id
    indexes:
      - name: _id_
        keys: [{ _id: 1 }]
      - name: idx_crpc_request_pipelines__auditIps_asc
        keys: [{ createdIp: 1 }, { updatedIp: 1 }]
      - name: idx_crpc_request_pipelines__crpcRequestId_lineItem_asc
        keys: [{ crpcRequestId: 1 }, { lineItem: 1 }]
        unique: true
      - name: idx_crpc_request_pipelines__keyFieldValue_asc
        keys: [{ keyFieldValue: 1 }]
      - name: idx_crpc_request_pipelines__lineItemRequestStatus_asc
        keys: [{ lineItemRequestStatus: 1 }]
      - name: idx_crpc_request_pipelines__operatorId_serviceId_asc
        keys: [{ operatorId: 1 }, { serviceId: 1 }]

  - name: approval_chain
    purpose: Tracks the live approval status for a pipeline item
    fields:
      _id:                   { type: ObjectId, required: true }
      crpcRequestPipelineId: { type: ObjectId, ref: crpc_request_pipelines._id, required: true }
      currentStep:           { type: number, required: true }
      approvalChainStatus:   { type: string, enum: ApprovalChainStatus, required: true }
      rejectReason:          { type: string }
      isActive:              { type: boolean, default: true }
      createdBy:             { type: ObjectId }
      createdAt:             { type: Date }
      updatedBy:             { type: ObjectId }
      updatedAt:             { type: Date }
      createdIp:             { type: string }
      updatedIp:             { type: string }
    relations:
      - field: crpcRequestPipelineId
        ref: crpc_request_pipelines._id
    indexes:
      - name: _id_
        keys: [{ _id: 1 }]
      - name: idx_approval_chain__approvalChainStatus_asc
        keys: [{ approvalChainStatus: 1 }]
      - name: idx_approval_chain__auditIps_asc
        keys: [{ createdIp: 1 }, { updatedIp: 1 }]
      - name: idx_approval_chain__crpcRequestPipelineId_asc
        keys: [{ crpcRequestPipelineId: 1 }]
        unique: true

  - name: consolidated_crpc_requests
    purpose: Consolidated outbound dispatch packets (letters + attachments) per operator/mode
    fields:
      _id:                      { type: ObjectId, required: true }
      mode:                     { type: string, enum: DispatchModes, required: true }
      serviceId:                { type: ObjectId, ref: service_master._id }
      operatorId:               { type: ObjectId, ref: operators_list._id, required: true }
      crpcRequestPipelineIds:   { type: array[ObjectId], ref: crpc_request_pipelines._id, required: true }
      attachmentsForSendingMail:
        type: array[object]
        item:
          attachmentName: { type: string }
          formatFilePath: { type: string }
      letterFilePaths:          { type: array[string] }
      status:                   { type: string, enum: consolidatedCrpcRequestStatus }
      downloadedAt:             { type: Date }
      totalRequests:            { type: number, required: true }
      isActive:                 { type: boolean, default: true }
      createdBy:                { type: ObjectId }
      createdAt:                { type: Date }
      updatedBy:                { type: ObjectId }
      updatedAt:                { type: Date }
      createdIp:                { type: string }
      updatedIp:                { type: string }
    indexes:
      - name: _id_
        keys: [{ _id: 1 }]
      - name: idx_consolidated_crpc_requests__auditIps_asc
        keys: [{ createdIp: 1 }, { updatedIp: 1 }]
      - name: idx_consolidated_crpc_requests__operatorId_status_mode_asc
        keys: [{ operatorId: 1 }, { status: 1 }, { mode: 1 }]

  - name: data_received
    purpose: Tracks incoming operator/bank responses (meta only)
    fields:
      _id:         { type: ObjectId, required: true }
      receivedAt:  { type: Date, required: true }
      operatorId:  { type: ObjectId, ref: operators_list._id, required: true }
      totalFiles:  { type: number, required: true }
      emailMetaData:
        type: object
        fields:
          from:    { type: string }
          subject: { type: string }
          password:{ type: string } # corrected to string (not array)
      isActive:    { type: boolean, default: true }
      createdBy:   { type: ObjectId }
      createdAt:   { type: Date }
      updatedBy:   { type: ObjectId }
      updatedAt:   { type: Date }
      createdIp:   { type: string }
      updatedIp:   { type: string }
    indexes:
      - name: _id_
        keys: [{ _id: 1 }]
      - name: idx_data_received__auditIps_asc
        keys: [{ createdIp: 1 }, { updatedIp: 1 }]
      - name: idx_data_received__operatorId_asc
        keys: [{ operatorId: 1 }]
      - name: idx_data_received__receivedAt_desc
        keys: [{ receivedAt: -1 }]

  - name: data_received_files
    purpose: File-level mapping of received artifacts back to requests/pipelines
    fields:
      _id:                  { type: ObjectId, required: true }
      dataReceivedId:       { type: ObjectId, ref: data_received._id, required: true }
      crpcRequestId:        { type: ObjectId, ref: crpc_requests._id, required: true }
      crpcRequestPipelineId:{ type: ObjectId, ref: crpc_request_pipelines._id }
      keyFieldValue:        { type: string, required: true }
      filePath:             { type: string, required: true }
      dataReceivedStatus:   { type: string, enum: dataReceivedStatus }
      isActive:             { type: boolean, default: true }
      createdBy:            { type: ObjectId }
      createdAt:            { type: Date }
      updatedBy:            { type: ObjectId }
      updatedAt:            { type: Date }
      createdIp:            { type: string }
      updatedIp:            { type: string }
    indexes:
      - name: _id_
        keys: [{ _id: 1 }]
      - name: idx_data_received_files__auditIps_asc
        keys: [{ createdIp: 1 }, { updatedIp: 1 }]
      - name: idx_data_received_files__crpcRequestId_asc
        keys: [{ crpcRequestId: 1 }]
      - name: idx_data_received_files__dataReceivedId_asc
        keys: [{ dataReceivedId: 1 }]
      - name: idx_data_received_files__keyFieldValue_status_asc
        keys: [{ keyFieldValue: 1 }, { dataReceivedStatus: 1 }]
